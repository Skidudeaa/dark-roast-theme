name: CI

# The validator suite is the enforcement layer for the token contracts and the
# Operational Interface Doctrine. It only means anything if it runs on its own.
# Commit 9a40e50 edited a variant source without regenerating dist/, and the
# stale output survived three further commits because nothing checked.
#
# Solo maintainer, no PR workflow: this runs on push and reports.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: npm test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned LTS. Local dev may run ahead; CI is the reproducible target.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Runs the complete theme, platform, doctrine, semantic-CSS, export, and
      # actual-package integrity suite. package.json owns the exact order.
      - name: Validate
        run: npm test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
