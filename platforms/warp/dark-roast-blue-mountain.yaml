# ── Warp chrome ─────────────────────────────────────────────────────────────
accent:     "#ef912d"   # amber — selection highlights and Warp UI accent ring
background: "#000b1d"   # void — warm-dark deepest layer
foreground: "#e5ecf3"   # crema — primary text, 16.54:1 contrast vs void
cursor:     "#00b5b5"   # teal — kinetic live-data cursor, matches editor caret
details:    darker      # Warp lightens or darkens chrome decoration; "darker"
                        # keeps tab bar and sidebar darker than the background,
                        # which is correct for a warm-dark bg

# ── ANSI-16 terminal colors ──────────────────────────────────────────────────
terminal_colors:
