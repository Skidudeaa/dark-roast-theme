# ── Warp chrome ─────────────────────────────────────────────────────────────
accent:     "#E18826"   # amber — selection highlights and Warp UI accent ring
background: "#190605"   # void — warm-dark deepest layer
foreground: "#F7EADE"   # crema — primary text, 16.62:1 contrast vs void
cursor:     "#42B3A8"   # teal — kinetic live-data cursor, matches editor caret
details:    darker      # Warp lightens or darkens chrome decoration; "darker"
                        # keeps tab bar and sidebar darker than the background,
                        # which is correct for a warm-dark bg

# ── ANSI-16 terminal colors ──────────────────────────────────────────────────
terminal_colors:
