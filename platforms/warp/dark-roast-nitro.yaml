    blue:    "#0C3F5C"  # ANSI 4 — slate (dusty steel; git diff header, less prompt)
    magenta: "#422F5F"  # ANSI 5 — mauve (dried lavender; grep matches, vim special)
    cyan:    "#004444"  # ANSI 6 — teal (live data; matches cursor + DR teal token)
    white:   "#0E0804"  # ANSI 7 — bone (reduced-contrast; comment-level brightness)

  bright:
    black:   "#7A6F67"  # ANSI 8  — crater-deep (comment gray; git log graph, tmux inactive)
    red:     "#772B28"  # ANSI 9  — scarlet companion-bright (diff removed, error paths)
    green:   "#13310B"  # ANSI 10 — sage companion-bright (diff added, success paths)
    yellow:  "#2D1F00"  # ANSI 11 — gold (success / stable; DR gold token, git branch)
    blue:    "#00314C"  # ANSI 12 — slate companion-bright (links, prompt path segments)
