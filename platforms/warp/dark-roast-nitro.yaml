# ── Warp chrome ─────────────────────────────────────────────────────────────
accent:     "#492B00"   # amber — selection highlights and Warp UI accent ring
background: "#E1DDDA"   # void — warm-dark deepest layer
foreground: "#000000"   # crema — primary text, 15.56:1 contrast vs void
cursor:     "#004444"   # teal — kinetic live-data cursor, matches editor caret
details:    darker      # Warp lightens or darkens chrome decoration; "darker"
                        # keeps tab bar and sidebar darker than the background,
                        # which is correct for a warm-dark bg

# ── ANSI-16 terminal colors ──────────────────────────────────────────────────
terminal_colors:
  normal:
    black:   "#D5D0CB"  # ANSI 0 — obsidian (elevated floor, not as deep as void)
    red:     "#7E312E"  # ANSI 1 — scarlet (error / critical severity)
