# ── Warp chrome ─────────────────────────────────────────────────────────────
accent:     "#7D4E00"   # amber — selection highlights and Warp UI accent ring
background: "#E5DBDA"   # void — warm-dark deepest layer
foreground: "#010000"   # crema — primary text, 15.46:1 contrast vs void
cursor:     "#006262"   # teal — kinetic live-data cursor, matches editor caret
details:    darker      # Warp lightens or darkens chrome decoration; "darker"
                        # keeps tab bar and sidebar darker than the background,
                        # which is correct for a warm-dark bg

# ── ANSI-16 terminal colors ──────────────────────────────────────────────────
