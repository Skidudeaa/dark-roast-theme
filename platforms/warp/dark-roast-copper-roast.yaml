background: "#34251C"   # void — warm-dark deepest layer
foreground: "#FFF9F4"   # crema — primary text, 14.09:1 contrast vs void
cursor:     "#24C6B6"   # teal — kinetic live-data cursor, matches editor caret
details:    darker      # Warp lightens or darkens chrome decoration; "darker"
                        # keeps tab bar and sidebar darker than the background,
                        # which is correct for a warm-dark bg

