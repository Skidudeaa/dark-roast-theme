# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: Blue Mountain"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: Blue Mountain"

      # Chrome colors
      foreground:          '#e5ecf3'    # crema — primary text
      background:          '#000b1d'    # void — warm-dark deepest layer
      cursor:              '#00b5b5'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#000b1d'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#052544) at 40% gives a warm visible selection without contrast clash.
      selection:           '#05254466'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#e5ecf3'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#001228'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#f86572'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#60a563'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#ef912d'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#49accf'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#b181e5'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#00b5b5'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#c3cfdc'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#8797a9'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#f55e6c'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#6dba70'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#ebaa1f'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#49c1ea'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#bd87f6'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#00caca'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#e5ecf3'    # 15 Bright White  — crema (full brightness; bold headings)
