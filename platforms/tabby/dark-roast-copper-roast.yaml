# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: Copper Roast"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: Copper Roast"

      # Chrome colors
      foreground:          '#FFF9F4'    # crema — primary text
      background:          '#34251C'    # void — warm-dark deepest layer
      cursor:              '#24C6B6'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#34251C'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#47352A) at 40% gives a warm visible selection without contrast clash.
      selection:           '#47352A66'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#FFF9F4'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#3A2A20'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#FF7D70'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#7DC45F'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#F5A33A'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#5DB4E8'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#DB86D0'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#24C6B6'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#F3E7DD'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#C4A78E'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#FF9184'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#A3DD7B'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#E4B20B'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#68D0F8'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#EC94E0'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#5FE0D1'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#FFF9F4'    # 15 Bright White  — crema (full brightness; bold headings)
