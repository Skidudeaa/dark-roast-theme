# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: Nitro"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: Nitro"

      # Chrome colors
      foreground:          '#000000'    # crema — primary text
      background:          '#E1DDDA'    # void — warm-dark deepest layer
      cursor:              '#004444'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#E1DDDA'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#BFB5AE) at 40% gives a warm visible selection without contrast clash.
      selection:           '#BFB5AE66'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#000000'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#D5D0CB'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#7E312E'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#213A1C'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#492B00'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#0C3F5C'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#422F5F'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#004444'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#0E0804'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#7A6F67'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#772B28'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#13310B'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#2D1F00'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#00314C'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#361F56'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#003636'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#000000'    # 15 Bright White  — crema (full brightness; bold headings)
