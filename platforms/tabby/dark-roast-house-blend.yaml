# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: House Blend"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: House Blend"

      # Chrome colors
      foreground:          '#FFF8F0'    # crema — primary text
      background:          '#241810'    # void — warm-dark deepest layer
      cursor:              '#2CB9AA'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#241810'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#3B2A20) at 40% gives a warm visible selection without contrast clash.
      selection:           '#3B2A2066'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#FFF8F0'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#2B1D14'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#FE8175'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#79B56C'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#E9922E'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#6AACE2'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#D28DE2'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#2CB9AA'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#E9DCCF'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#BCA18A'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#FF9286'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#98D083'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#D0A200'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#68C7F4'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#E792DF'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#72D8CA'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#FFF8F0'    # 15 Bright White  — crema (full brightness; bold headings)
