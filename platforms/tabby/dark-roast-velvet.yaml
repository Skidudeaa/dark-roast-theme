# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: Velvet"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: Velvet"

      # Chrome colors
      foreground:          '#F7EADE'    # crema — primary text
      background:          '#190605'    # void — warm-dark deepest layer
      cursor:              '#42B3A8'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#190605'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#3B1817) at 40% gives a warm visible selection without contrast clash.
      selection:           '#3B181766'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#F7EADE'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#240A09'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#D4494E'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#60A659'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#E18826'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#608BB7'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#BC60AD'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#42B3A8'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#E4D1C2'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#AC8981'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#ED6667'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#7EBE77'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#E4AE28'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#77A3D0'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#D47AC4'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#63CDC1'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#F7EADE'    # 15 Bright White  — crema (full brightness; bold headings)
