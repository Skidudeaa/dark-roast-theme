# ── Tabby activation ─────────────────────────────────────────────────────────
# This block tells Tabby which scheme to use at runtime. It must appear
# somewhere in your config.yaml's `terminal:` section.
terminal:
  colorScheme:
    name: "Dark Roast: Velvet Noir"

  # ── Scheme definition ────────────────────────────────────────────────────
  customColorSchemes:
    - name: "Dark Roast: Velvet Noir"

      # Chrome colors
      foreground:          '#F6E4DA'    # crema — primary text
      background:          '#14030C'    # void — warm-dark deepest layer
      cursor:              '#36AFAB'    # teal — kinetic cursor, matches editor caret
      cursorAccent:        '#14030C'    # void — text inside cursor block (inverted)
      # Tabby uses CSS color strings; the trailing 66 is hex for ~40% alpha.
      # Espresso (#3A1528) at 40% gives a warm visible selection without contrast clash.
      selection:           '#3A152866'  # espresso + 40% alpha — warm polished surface
      selectionForeground: '#F6E4DA'    # crema — ensures legibility on selection bg

      # ANSI-16 palette
      # Tabby expects exactly 16 entries in order: 0–7 normal, 8–15 bright.
      # Each entry corresponds to ANSI escape code \e[3Xm (normal) / \e[9Xm (bright).
      colors:
        # ── Normal (ANSI indices 0–7) ────────────────────────────────────
        - '#1F0514'    # 0  ANSI Black    — obsidian (dark floor, not as deep as void)
        - '#D4445E'    # 1  ANSI Red      — scarlet (error / critical severity)
        - '#51A460'    # 2  ANSI Green    — sage (warm fern; ls dirs, git diff +lines)
        - '#E28233'    # 3  ANSI Yellow   — amber (warning / accent; DR primary CTA)
        - '#6486B9'    # 4  ANSI Blue     — slate (dusty steel; git diff headers)
        - '#C85BA0'    # 5  ANSI Magenta  — mauve (dried lavender; grep matches)
        - '#36AFAB'    # 6  ANSI Cyan     — teal (live data; matches cursor token)
        - '#E3CAC0'    # 7  ANSI White    — bone (reduced-contrast light text)
        # ── Bright (ANSI indices 8–15) ───────────────────────────────────
        - '#A88594'    # 8  Bright Black  — crater-deep (comment gray; tmux inactive pane)
        - '#EC6175'    # 9  Bright Red    — scarlet companion-bright (diff removed)
        - '#70BB7C'    # 10 Bright Green  — sage companion-bright (diff added)
        - '#E8A72D'    # 11 Bright Yellow — gold (success / stable; git branch name)
        - '#7B9ED2'    # 12 Bright Blue   — slate companion-bright (links, paths)
        - '#E076B7'    # 13 Bright Magenta — mauve companion-bright (special tokens)
        - '#59CAC5'    # 14 Bright Cyan   — teal lightened (brighter than ANSI 6;
                       #                    "bright" should be visually distinct)
        - '#F6E4DA'    # 15 Bright White  — crema (full brightness; bold headings)
